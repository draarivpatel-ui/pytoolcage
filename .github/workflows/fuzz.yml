name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  python-fuzz:
    name: Python security fuzz
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install hash pinned fuzzing runtime
        run: python3 -m pip install --require-hashes -r .github/requirements/fuzz-requirements.txt

      - name: Run deterministic security fuzz harness
        env:
          PYTHONPATH: src
        run: python3 tests/test_fuzz.py -runs=256 -seed=1861 -detect_leaks=0 -print_final_stats=1
